# Front proxy — the only container that publishes a port. Routes by hostname
# to two separate Laravel apps (each with its own database):
#   vikings.powerbear.co.za    -> site   (public site + booking portal)
#   franchise.powerbear.co.za  -> portal (investor signup, /admin, /portal)
# Bare-IP / unknown hosts fall through to the portal, as before.

# Keep an upstream X-Forwarded-Proto (e.g. from Cloudflare); else use ours.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name vikings.powerbear.co.za;
    client_max_body_size 8m;
    location / {
        proxy_pass http://site:80;
        include /etc/nginx/proxy-headers.conf;
    }
}

server {
    listen 80;
    server_name franchise.powerbear.co.za;
    client_max_body_size 32m;
    location / {
        proxy_pass http://portal:80;
        include /etc/nginx/proxy-headers.conf;
    }
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 32m;
    location / {
        proxy_pass http://portal:80;
        include /etc/nginx/proxy-headers.conf;
    }
}
