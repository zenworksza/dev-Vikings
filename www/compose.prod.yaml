# Production stack. Mirrors Sail's service shape (app, MySQL, Redis) minus
# dev-only bits — no bind-mounted source, no Vite dev server, no
# MinIO/Mailpit. Built assets and vendor/ are baked into the app image at
# build time (see Dockerfile). Secrets/config come from `.env` on the host
# via `env_file` — never baked into the image.
#
# Deploy: git pull && docker compose -f compose.prod.yaml up -d --build

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: vikings-app:prod
        restart: unless-stopped
        env_file: .env
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - app-storage:/var/www/html/storage/app
        networks:
            - vikings
        depends_on:
            - mysql
            - redis

    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - vikings
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            retries: 5
            timeout: 5s

    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        volumes:
            - redis-data:/data
        networks:
            - vikings
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 5
            timeout: 5s

networks:
    vikings:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
    app-storage:
        driver: local
