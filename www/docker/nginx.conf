# Internal nginx for the franchise-portal container — the compose front proxy
# (../docker/proxy.conf) routes franchise.powerbear.co.za (and any unknown
# host / bare IP) here. The public site is a separate app: see ../site.

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    include /etc/nginx/vikings-app.conf;
}
