# One app, two subdomains — vikings.powerbear.co.za (public marketing site,
# Ember) and franchise.powerbear.co.za (franchise portal — investor
# signup/login plus /admin and /portal, Hearthwood). Both proxy to the same
# php-fpm backend; Laravel picks the theme per-request from the Host header
# (see App\Support\SiteTheme, config('app.public_host')/('app.portal_host')).
# A bare-IP/unrecognized-host request still falls through to the default
# server below so the app stays reachable before DNS/SSL are fully wired.

server {
    listen 80;
    server_name vikings.powerbear.co.za;
    root /var/www/html/public;
    include /etc/nginx/vikings-app.conf;
}

server {
    listen 80;
    server_name franchise.powerbear.co.za;
    root /var/www/html/public;
    include /etc/nginx/vikings-app.conf;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    include /etc/nginx/vikings-app.conf;
}
