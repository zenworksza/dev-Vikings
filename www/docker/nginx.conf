# Two subdomains, two apps behind one nginx:
#   vikings.powerbear.co.za    — static PHP marketing site (www/site/), no
#                                 framework/database, own docroot
#   franchise.powerbear.co.za  — Laravel: investor signup/login plus the
#                                 Filament /admin and /portal panels
# A bare-IP/unrecognized-host request falls through to the default server
# (Laravel) so the app stays reachable before DNS/SSL are fully wired.

server {
    listen 80;
    server_name vikings.powerbear.co.za;
    root /var/www/html/site;
    include /etc/nginx/vikings-site.conf;
}

server {
    listen 80;
    server_name franchise.powerbear.co.za;
    root /var/www/html/public;
    include /etc/nginx/vikings-app.conf;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    include /etc/nginx/vikings-app.conf;
}
